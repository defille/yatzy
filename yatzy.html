<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Yatzy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background-color: #050f08;
            background-image:
                radial-gradient(ellipse 70% 50% at 5%  10%, rgba(14,55,22,0.75) 0%, transparent 55%),
                radial-gradient(ellipse 60% 70% at 95% 90%, rgba(10,42,18,0.80) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(6,28,12,0.50) 0%, transparent 70%);
            color: #c4ddb4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
            overflow-x: hidden;
        }

        /* ── Corner leaves ── */
        .leaf { position: fixed; pointer-events: none; z-index: 0; }
        .leaf-tl { top:0; left:0; width:220px; height:260px; }
        .leaf-br { bottom:0; right:0; width:220px; height:260px; transform:rotate(180deg); }
        .leaf-tr { top:0; right:0; width:180px; height:220px; transform:scaleX(-1); }

        /* ── Monkey layer ── */
        #monkey-layer {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .mky {
            position: absolute;
            font-size: 2.6rem;
            line-height: 1;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Jumpers */
        .type-jump {
            animation-name: mkyJump;
            animation-duration: var(--dur, 1.1s);
            animation-delay: var(--delay, 0s);
            animation-timing-function: cubic-bezier(0.36, 0.07, 0.19, 0.97);
            animation-iteration-count: infinite;
        }
        @keyframes mkyJump {
            0%,100%{ transform: translateY(0) scaleX(1) rotate(0); }
            25%    { transform: translateY(-40px) scaleX(1.1) rotate(-6deg); }
            50%    { transform: translateY(-68px) scaleX(0.9) rotate(6deg); }
            75%    { transform: translateY(-38px) scaleX(1.1) rotate(-3deg); }
        }

        /* Swingers */
        .type-swing {
            transform-origin: top center;
            animation-name: mkySwing;
            animation-duration: var(--dur, 2.8s);
            animation-delay: var(--delay, 0s);
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }
        @keyframes mkySwing {
            0%,100%{ transform: rotate(-28deg); }
            50%    { transform: rotate(28deg); }
        }
        .mky-vine {
            width: 5px; height: 105px;
            background: repeating-linear-gradient(to bottom,#6b4a18 0,#6b4a18 8px,#4a3210 8px,#4a3210 16px);
            border-radius: 3px;
            margin-bottom: -4px;
            flex-shrink: 0;
        }

        /* Speech bubble */
        .mky-speech {
            position: absolute;
            background: rgba(255,253,215,0.97);
            color: #2a1800;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.72rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
            font-style: normal;
            width: 175px;
            text-align: center;
            line-height: 1.45;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            white-space: pre-wrap;
            word-break: break-word;
            transition: opacity 0.45s ease;
        }
        .mky-speech.show { opacity: 1; }

        /* Left-side: bubble opens rightward */
        .side-left .mky-speech  { bottom: 110%; left: 3.2rem; }
        .side-left .mky-speech::before {
            content:''; position:absolute;
            bottom:10px; left:-11px;
            border:7px solid transparent;
            border-right-color:rgba(255,253,215,0.97);
        }
        /* Right-side: bubble opens leftward */
        .side-right .mky-speech { bottom: 110%; right: 3.2rem; }
        .side-right .mky-speech::before {
            content:''; position:absolute;
            bottom:10px; right:-11px;
            border:7px solid transparent;
            border-left-color:rgba(255,253,215,0.97);
        }
        /* Swingers: bubble below the monkey */
        .type-swing .mky-speech {
            bottom: auto;
            top: calc(105px + 2.6rem + 8px);
        }

        /* Crazy mode (Yatzy scored) */
        .mky.crazy { animation-duration: 0.28s !important; }

        /* ── Header ── */
        header { position:relative; z-index:1; text-align:center; margin-bottom:28px; }
        h1 {
            font-size: 3rem; letter-spacing: 14px; font-weight: 900; text-transform: uppercase;
            color: #b8e030;
            text-shadow: 0 0 24px rgba(140,210,30,0.55), 0 2px 6px rgba(0,0,0,0.8);
        }
        .subtitle { color:rgba(140,190,100,0.45); font-size:0.78rem; letter-spacing:5px; margin-top:5px; }

        /* ── Game layout ── */
        .game-container {
            position: relative; z-index: 1;
            display: flex; gap: 20px;
            width: 100%; max-width: 900px;
            align-items: flex-start; flex-wrap: wrap; justify-content: center;
        }
        .left-panel { flex:1; min-width:280px; max-width:360px; }

        /* ── Dice area ── */
        .dice-area {
            background: linear-gradient(155deg, rgba(10,32,16,0.97), rgba(5,18,9,0.99));
            border-radius: 20px; padding: 22px 18px 18px;
            border: 1px solid rgba(70,150,45,0.35);
            box-shadow: 0 8px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(100,200,50,0.12);
        }
        .dice-area.shaking { animation: areaShake 0.45s ease; }
        @keyframes areaShake {
            0%,100%{ transform:translateX(0) rotate(0); }
            15%    { transform:translateX(-6px) rotate(-1deg); }
            30%    { transform:translateX(6px) rotate(1deg); }
            50%    { transform:translateX(-5px) rotate(-0.5deg); }
            70%    { transform:translateX(5px) rotate(0.5deg); }
            85%    { transform:translateX(-2px); }
        }

        .turn-info { text-align:center; color:rgba(150,195,110,0.55); font-size:0.78rem; letter-spacing:2px; margin-bottom:14px; }
        .turn-info strong { color:#b8e030; }

        .dice-row { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
        .die-wrap  { display:flex; flex-direction:column; align-items:center; }

        .die {
            width:64px; height:64px;
            background: linear-gradient(145deg,#f8f5e8,#e5e0ca);
            border-radius:14px; cursor:pointer;
            display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
            padding:9px; gap:3px;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 5px 14px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.9);
            user-select:none;
        }
        .die.held {
            background: linear-gradient(145deg,#d8f060,#a4c020);
            box-shadow: 0 0 18px rgba(160,200,20,0.65), 0 5px 14px rgba(0,0,0,0.4);
        }
        .die:hover { transform:translateY(-4px); }
        .die.rolling { animation:dieRoll 0.35s ease; }
        @keyframes dieRoll {
            0%  { transform:rotate(0) scale(1); }
            20% { transform:rotate(-18deg) scale(0.88); }
            50% { transform:rotate(12deg) scale(1.12); }
            75% { transform:rotate(-6deg) scale(0.96); }
            100%{ transform:rotate(0) scale(1); }
        }
        .dot { border-radius:50%; background:#1e1a0e; width:100%; height:100%; }
        .die.held .dot { background:#3a4a00; }
        .dot.off { visibility:hidden; }
        .die-held-tag { margin-top:4px; font-size:0.6rem; color:#a0c820; letter-spacing:1px; height:11px; font-weight:700; }

        /* ── Roll button ── */
        .roll-btn {
            display:block; width:100%; padding:14px;
            background: linear-gradient(135deg,#3a9a28,#266018);
            color:#e0f5cc; border:1px solid rgba(100,200,50,0.35);
            border-radius:12px; font-size:1rem; font-weight:700;
            cursor:pointer; letter-spacing:3px; text-transform:uppercase;
            transition:all 0.2s; box-shadow:0 4px 16px rgba(30,100,15,0.5);
        }
        .roll-btn:hover:not(:disabled) {
            background:linear-gradient(135deg,#48bc32,#2e7820);
            transform:translateY(-1px); box-shadow:0 6px 22px rgba(40,140,15,0.6);
        }
        .roll-btn:active:not(:disabled) { transform:translateY(0); }
        .roll-btn:disabled {
            background:rgba(14,32,10,0.9); color:rgba(90,130,60,0.35);
            cursor:not-allowed; box-shadow:none; border-color:rgba(50,90,30,0.2);
        }

        /* ── Roll counter ── */
        .roll-counter { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:14px; }
        .roll-dots { display:flex; gap:7px; }
        .roll-dot {
            width:13px; height:13px; border-radius:50%;
            background:rgba(30,65,20,0.9); border:2px solid rgba(70,130,40,0.35);
            transition:all 0.3s;
        }
        .roll-dot.done { background:#3a9a28; border-color:#60cc40; box-shadow:0 0 7px rgba(60,160,30,0.65); }
        .roll-dot.next { background:transparent; border:2px dashed #3a9a28; animation:dotPulse 1.1s ease-in-out infinite; }
        @keyframes dotPulse {
            0%,100%{ box-shadow:0 0 0 0 rgba(60,160,30,0); }
            50%    { box-shadow:0 0 0 4px rgba(60,160,30,0.3); }
        }
        .roll-text { font-size:0.8rem; font-weight:600; color:rgba(160,210,110,0.7); letter-spacing:1px; min-width:95px; }
        .roll-text strong { color:#b8e030; }

        .hint { text-align:center; margin-top:10px; color:rgba(120,170,80,0.5); font-size:0.77rem; min-height:16px; font-style:italic; }

        /* ── Scorecard ── */
        .scorecard {
            background: linear-gradient(155deg,rgba(8,28,14,0.98),rgba(4,16,8,0.99));
            border-radius:20px; padding:14px 12px;
            border:1px solid rgba(70,150,45,0.35);
            box-shadow:0 8px 32px rgba(0,0,0,0.55);
            flex:1; min-width:280px; max-width:390px;
        }
        .scorecard h2 { text-align:center; font-size:0.68rem; letter-spacing:5px; color:rgba(120,175,80,0.45); text-transform:uppercase; margin-bottom:10px; }
        .section-label { font-size:0.67rem; text-transform:uppercase; letter-spacing:3px; color:#8ac030; padding:0 8px; margin:10px 0 4px; }

        .score-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:7px 10px; border-radius:8px; margin-bottom:2px;
            cursor:default; transition:background 0.15s;
        }
        .score-row.clickable { cursor:pointer; }
        .score-row.clickable:hover { background:rgba(50,130,25,0.22); }

        .score-row.preview {
            border-left:2px solid rgba(80,180,35,0.45);
            animation:previewPulse 2.2s ease-in-out infinite;
        }
        @keyframes previewPulse {
            0%,100%{ background:rgba(40,110,20,0.14); }
            50%    { background:rgba(55,145,25,0.28); }
        }
        .score-row.preview:hover { background:rgba(55,140,25,0.32) !important; animation:none; }

        .score-row.scratch-option {
            background:rgba(100,25,15,0.12);
            border-left:2px solid rgba(180,70,40,0.3);
        }
        .score-row.scratch-option:hover { background:rgba(140,35,20,0.25) !important; }
        .score-row.scratch-option .score-name { color:rgba(190,150,130,0.7); }
        .score-row.scratch-option .score-desc { color:rgba(150,100,80,0.45); }

        .score-row.filled { opacity:0.8; }
        .score-row.scratched { opacity:0.55; }
        .score-row.scratched .score-name {
            text-decoration:line-through; text-decoration-color:rgba(180,80,60,0.6);
            color:rgba(160,120,100,0.6);
        }

        .score-name { font-size:0.86rem; color:#b4cfa4; }
        .score-desc { font-size:0.67rem; color:rgba(110,155,75,0.55); margin-top:1px; }
        .score-val { font-size:0.95rem; font-weight:700; min-width:34px; text-align:right; }
        .score-val.preview-pos  { color:#78e030; }
        .score-val.preview-zero { color:rgba(70,100,50,0.45); }
        .score-val.scored       { color:#b8e030; }
        .score-val.scored-zero  { color:rgba(180,80,60,0.5); }
        .score-val.scratch-zero { color:rgba(200,100,70,0.65); font-size:0.85rem; }
        .score-val.empty        { color:rgba(50,80,35,0.35); }

        .divider { height:1px; background:rgba(55,120,30,0.2); margin:5px 4px; }
        .bonus-track { padding:4px 10px; font-size:0.74rem; color:rgba(130,180,90,0.6); display:flex; justify-content:space-between; align-items:center; }
        .bonus-val { font-weight:700; color:#b8e030; }
        .bonus-bar-wrap { height:4px; background:rgba(20,55,12,0.9); border-radius:2px; margin:0 10px 6px; overflow:hidden; }
        .bonus-bar-fill { height:100%; background:linear-gradient(90deg,#3a9a28,#b8e030); border-radius:2px; transition:width 0.4s; }

        .total-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:10px; border-top:1px solid rgba(75,155,35,0.28);
            margin-top:6px; font-size:1rem; font-weight:700; color:#b8e030;
            transition: transform 0.3s;
        }
        .total-row.pop { animation: totalPop 0.5s ease; }
        @keyframes totalPop {
            0%  { transform:scale(1); color:#b8e030; }
            40% { transform:scale(1.08); color:#f0e060; }
            100%{ transform:scale(1); color:#b8e030; }
        }

        .scorecard.must-choose { animation:scPulse 1.4s ease-in-out infinite; }
        @keyframes scPulse {
            0%,100%{ border-color:rgba(70,150,45,0.35); }
            50%    { border-color:rgba(200,120,40,0.55); }
        }

        /* ── Game over modal ── */
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,8,2,0.87); z-index:100; align-items:center; justify-content:center; }
        .overlay.show { display:flex; }
        .modal {
            background:linear-gradient(155deg,#091a0c,#050f07);
            border:1px solid rgba(80,180,40,0.4); border-radius:22px;
            padding:44px 36px; text-align:center; max-width:320px; width:90%;
            box-shadow:0 0 60px rgba(30,110,15,0.35);
        }
        .modal h2 { font-size:1.8rem; color:#b8e030; letter-spacing:6px; text-transform:uppercase; margin-bottom:8px; text-shadow:0 0 20px rgba(160,220,30,0.5); }
        .modal .label { color:rgba(130,180,90,0.6); font-size:0.8rem; letter-spacing:3px; }
        .final-score-val { font-size:4rem; font-weight:700; color:#e8e8e8; margin:16px 0 6px; line-height:1; }
        .score-rating { color:rgba(150,200,110,0.7); font-size:0.9rem; margin-bottom:28px; }
        .play-again-btn {
            padding:13px 32px; background:linear-gradient(135deg,#3a9a28,#266018);
            color:#e0f5cc; border:1px solid rgba(100,200,50,0.4); border-radius:12px;
            font-size:0.95rem; font-weight:700; cursor:pointer; letter-spacing:3px; text-transform:uppercase; transition:all 0.2s;
        }
        .play-again-btn:hover { background:linear-gradient(135deg,#48bc32,#2e7820); }

        /* ── Floating score popup ── */
        .float-pts {
            position:fixed; font-weight:900; font-size:1.5rem;
            pointer-events:none; z-index:400;
            transition: transform 0.95s cubic-bezier(0.2,0.8,0.3,1), opacity 0.95s ease;
        }
        .float-pts.pts-good   { color:#b8e030; text-shadow:0 0 10px rgba(180,220,30,0.9); }
        .float-pts.pts-zero   { color:rgba(220,100,70,0.9); text-shadow:0 0 8px rgba(200,80,50,0.6); }

        /* ── Bonus popup ── */
        .bonus-popup {
            position:fixed; top:38%; left:50%; transform:translate(-50%,0);
            font-size:1.8rem; font-weight:900; color:#f0c040;
            text-shadow:0 0 20px rgba(240,192,64,0.8);
            background:rgba(8,25,10,0.92); border:2px solid rgba(240,192,64,0.5);
            border-radius:14px; padding:10px 26px; pointer-events:none; z-index:400;
            opacity:1; transition:transform 1.3s cubic-bezier(0.2,0.8,0.3,1), opacity 1.3s ease;
        }

        @media (max-width:580px) {
            .die { width:54px; height:54px; padding:7px; }
            h1 { font-size:2.2rem; letter-spacing:8px; }
            #monkey-layer { display:none; }
        }

        /* ── Yatzy celebration ── */
        #yatzy-canvas { position:fixed; inset:0; pointer-events:none; z-index:150; }
        #yatzy-flash  { position:fixed; inset:0; background:radial-gradient(ellipse at center,rgba(240,192,64,0.35) 0%,transparent 70%); pointer-events:none; z-index:140; opacity:0; }
        #yatzy-flash.fire { animation:flashPulse 1s ease-out forwards; }
        @keyframes flashPulse { 0%{opacity:0} 15%{opacity:1} 100%{opacity:0} }
        #yatzy-text {
            position:fixed; top:42%; left:50%; transform:translate(-50%,-50%) scale(0);
            font-size:5.5rem; font-weight:900; color:#f0c040; letter-spacing:14px; text-transform:uppercase;
            text-shadow:0 0 20px rgba(240,192,64,1),0 0 50px rgba(240,192,64,0.7),0 0 100px rgba(240,192,64,0.4);
            z-index:200; pointer-events:none; opacity:0; white-space:nowrap;
        }
        #yatzy-text.fire { animation:yatzyBoom 2.8s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        @keyframes yatzyBoom {
            0%  { transform:translate(-50%,-50%) scale(0);    opacity:0; }
            12% { transform:translate(-50%,-50%) scale(1.4);  opacity:1; }
            22% { transform:translate(-50%,-50%) scale(0.95); opacity:1; }
            30% { transform:translate(-50%,-50%) scale(1.05); opacity:1; }
            60% { transform:translate(-50%,-50%) scale(1);    opacity:1; }
            100%{ transform:translate(-50%,-50%) scale(1.1);  opacity:0; }
        }
        #yatzy-sub {
            position:fixed; top:56%; left:50%; transform:translateX(-50%);
            font-size:1rem; letter-spacing:6px; color:#fff; z-index:200; pointer-events:none; opacity:0; white-space:nowrap;
        }
        #yatzy-sub.fire { animation:subFade 2.8s ease forwards; }
        @keyframes subFade {
            0%  { opacity:0; transform:translateX(-50%) translateY(10px); }
            25% { opacity:1; transform:translateX(-50%) translateY(0); }
            65% { opacity:1; }
            100%{ opacity:0; }
        }
    </style>
</head>
<body>

<!-- Jungle corner leaves -->
<div class="leaf leaf-tl">
    <svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
        <path d="M-10,260 C20,200 60,130 40,60 C60,90 65,150 50,220" fill="rgba(12,65,22,0.55)"/>
        <path d="M-20,240 C10,170 80,110 90,20 C105,70 90,150 60,230" fill="rgba(10,55,18,0.45)"/>
        <path d="M10,260 C50,200 30,120 80,50 C85,100 70,170 40,255" fill="rgba(15,70,25,0.4)"/>
        <path d="M-30,200 C10,160 70,140 110,80 C100,130 70,175 20,210" fill="rgba(8,50,16,0.35)"/>
    </svg>
</div>
<div class="leaf leaf-br">
    <svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
        <path d="M-10,260 C20,200 60,130 40,60 C60,90 65,150 50,220" fill="rgba(12,65,22,0.55)"/>
        <path d="M-20,240 C10,170 80,110 90,20 C105,70 90,150 60,230" fill="rgba(10,55,18,0.45)"/>
        <path d="M10,260 C50,200 30,120 80,50 C85,100 70,170 40,255" fill="rgba(15,70,25,0.4)"/>
    </svg>
</div>
<div class="leaf leaf-tr">
    <svg width="180" height="220" viewBox="0 0 180 220" xmlns="http://www.w3.org/2000/svg">
        <path d="M-10,220 C15,165 50,110 35,50 C55,75 55,130 40,190" fill="rgba(12,65,22,0.5)"/>
        <path d="M-15,200 C10,145 65,95 75,15 C88,55 75,130 50,195" fill="rgba(10,55,18,0.4)"/>
    </svg>
</div>

<!-- Monkey layer — 5 jungle monkeys with dad jokes -->
<div id="monkey-layer">
    <!-- Left bottom jumper -->
    <div class="mky type-jump side-left" style="left:0;bottom:55px;--dur:1.05s;--delay:0s;">
        <div class="mky-speech" id="ms0"></div>🐒
    </div>
    <!-- Right bottom jumper -->
    <div class="mky type-jump side-right" style="right:0;bottom:75px;--dur:1.18s;--delay:0.38s;">
        <div class="mky-speech" id="ms1"></div>🐒
    </div>
    <!-- Left high jumper -->
    <div class="mky type-jump side-left" style="left:0;bottom:260px;--dur:1.35s;--delay:0.7s;">
        <div class="mky-speech" id="ms2"></div>🦧
    </div>
    <!-- Right top swinger -->
    <div class="mky type-swing side-right" style="right:0;top:0;--dur:2.95s;--delay:0s;">
        <div class="mky-vine"></div>🐒
        <div class="mky-speech" id="ms3"></div>
    </div>
    <!-- Left top swinger -->
    <div class="mky type-swing side-left" style="left:0;top:0;--dur:2.6s;--delay:1.25s;">
        <div class="mky-vine"></div>🐒
        <div class="mky-speech" id="ms4"></div>
    </div>
</div>

<header>
    <h1>🌿 Yatzy 🌿</h1>
    <div class="subtitle">Roll · Hold · Score</div>
</header>

<div class="game-container">
    <div class="left-panel">
        <div class="dice-area" id="diceArea">
            <div class="turn-info">Turn <strong id="turnNum">1</strong> of 15</div>
            <div class="dice-row" id="diceRow"></div>
            <button class="roll-btn" id="rollBtn" onclick="roll()">Roll Dice</button>
            <div class="roll-counter">
                <div class="roll-dots">
                    <div class="roll-dot" id="rd0"></div>
                    <div class="roll-dot" id="rd1"></div>
                    <div class="roll-dot" id="rd2"></div>
                </div>
                <div class="roll-text" id="rollText">Roll <strong>1</strong> of 3</div>
            </div>
            <div class="hint" id="hint">Press Roll Dice to begin your turn</div>
        </div>
    </div>
    <div class="scorecard" id="scorecard"><h2>Scorecard</h2></div>
</div>

<!-- Yatzy celebration -->
<canvas id="yatzy-canvas"></canvas>
<div id="yatzy-flash"></div>
<div id="yatzy-text">Yatzy!</div>
<div id="yatzy-sub">50 Points!</div>

<!-- Game over -->
<div class="overlay" id="overlay">
    <div class="modal">
        <h2>Game Over</h2>
        <div class="label">Final Score</div>
        <div class="final-score-val" id="finalScoreVal">0</div>
        <div class="score-rating" id="scoreRating"></div>
        <button class="play-again-btn" onclick="newGame()">Play Again</button>
    </div>
</div>

<script>
    /* ── Dot patterns ── */
    const DOT_MAP = {1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

    /* ── Categories ── */
    const CATS = [
        {id:'ones',          name:'Ones',            sec:'upper', desc:'Sum of all 1s'},
        {id:'twos',          name:'Twos',            sec:'upper', desc:'Sum of all 2s'},
        {id:'threes',        name:'Threes',          sec:'upper', desc:'Sum of all 3s'},
        {id:'fours',         name:'Fours',           sec:'upper', desc:'Sum of all 4s'},
        {id:'fives',         name:'Fives',           sec:'upper', desc:'Sum of all 5s'},
        {id:'sixes',         name:'Sixes',           sec:'upper', desc:'Sum of all 6s'},
        {id:'onePair',       name:'One Pair',        sec:'lower', desc:'Sum of highest pair'},
        {id:'twoPairs',      name:'Two Pairs',       sec:'lower', desc:'Sum of both pairs'},
        {id:'threeKind',     name:'Three of a Kind', sec:'lower', desc:'3 × matching value'},
        {id:'fourKind',      name:'Four of a Kind',  sec:'lower', desc:'4 × matching value'},
        {id:'smallStraight', name:'Small Straight',   sec:'lower', desc:'15 pts — 1-2-3-4-5'},
        {id:'largeStraight', name:'Large Straight',   sec:'lower', desc:'20 pts — 2-3-4-5-6'},
        {id:'fullHouse',     name:'Full House',       sec:'lower', desc:'25 pts — three + two'},
        {id:'chance',        name:'Chance',           sec:'lower', desc:'Sum of all dice'},
        {id:'yatzy',         name:'Yatzy',            sec:'lower', desc:'50 pts — all five the same'},
    ];

    /* ── Dad jokes ── */
    const JOKES = [
        "Why don't eggs tell jokes?\nThey'd crack each other up! 😄",
        "Reading about anti-gravity.\nCan't put it down! 😂",
        "What do you call cheese\nthat isn't yours?\nNacho cheese! 🧀",
        "Scarecrow won an award —\noutstanding in his field! 🌾",
        "I used to hate facial hair...\nbut it grew on me! 🧔",
        "Why can't a bicycle stand?\nIt's two-tired! 🚲",
        "Space party?\nYou gotta planet! 🪐",
        "Sleeping dinosaur?\nA dino-snore! 🦕",
        "Atoms can't be trusted —\nthey make up everything! ⚗️",
        "Paper joke?\nNever mind, it's tearable! 📄",
        "Cows wear bells because\ntheir horns don't work! 🐄",
        "The ocean said nothing.\nIt just waved! 🌊",
        "Oysters don't share —\nthey're shellfish! 🦪",
        "I only know 25 letters.\nI don't know y! 🤷",
        "How to make a tissue dance?\nPut a boogie in it! 💃",
        "Elsa can't have a balloon.\nShe'll let it go! 🎈",
        "I'm on a seafood diet.\nI see food and eat it! 🍣",
        "Bananas go to the doctor —\nnot peeling well! 🍌",
        "Construction joke?\nI'm still working on it! 🏗️",
        "Tomato blushed because it\nsaw the salad dressing! 🥗",
        "What's an impasta?\nA fake noodle! 🍝",
        "Got a bakery job —\nI kneaded the dough! 🍞",
        "Peter Pan always flies\nbecause he Neverlands! 🧚",
        "Parallel lines have so much\nin common... shame they'll\nnever meet! 📐",
        "I told a joke about\nUDP once.\nYou might not get it! 📡",
        "My dog does magic tricks.\nIt's a labracadabrador! 🐕",
        "Why did the math book\nlook sad?\nToo many problems! 📚",
        "Golf is a game\nwhere you try to get\nthe lowest score... just\nlike Yatzy! 🎲",
    ];

    /* ── Game state ── */
    let dice, held, rollsLeft, scores, hasRolled, turn;

    /* ── Scoring ── */
    function calcScore(id, d) {
        const cnt=[0,0,0,0,0,0]; d.forEach(v=>cnt[v-1]++);
        const sum=d.reduce((a,b)=>a+b,0);
        switch(id){
            case 'ones': return cnt[0]*1;   case 'twos':   return cnt[1]*2;
            case 'threes': return cnt[2]*3; case 'fours':  return cnt[3]*4;
            case 'fives': return cnt[4]*5;  case 'sixes':  return cnt[5]*6;
            case 'onePair': for(let v=6;v>=1;v--) if(cnt[v-1]>=2) return v*2; return 0;
            case 'twoPairs': {const p=[];for(let v=6;v>=1;v--){if(cnt[v-1]>=2)p.push(v);if(p.length===2)break;} return p.length===2?(p[0]+p[1])*2:0;}
            case 'threeKind': for(let v=6;v>=1;v--) if(cnt[v-1]>=3) return v*3; return 0;
            case 'fourKind':  for(let v=6;v>=1;v--) if(cnt[v-1]>=4) return v*4; return 0;
            case 'fullHouse': return(cnt.some(c=>c===3)&&cnt.some(c=>c===2))?25:0;
            case 'smallStraight': {const s=new Set(d); return [1,2,3,4,5].every(v=>s.has(v))?15:0;}
            case 'largeStraight': {const s=new Set(d); return [2,3,4,5,6].every(v=>s.has(v))?20:0;}
            case 'yatzy':  return cnt.some(c=>c===5)?50:0;
            case 'chance': return sum;
        }
    }
    function upperSum()    { return CATS.filter(c=>c.sec==='upper').reduce((s,c)=>s+(scores[c.id]??0),0); }
    function upperFilled() { return CATS.filter(c=>c.sec==='upper').filter(c=>c.id in scores).length; }
    function totalScore()  { return Object.values(scores).reduce((a,b)=>a+b,0)+(upperFilled()===6&&upperSum()>=63?35:0); }

    /* ── Render dice ── */
    function renderDice() {
        const row=document.getElementById('diceRow'); row.innerHTML='';
        dice.forEach((val,i)=>{
            const wrap=document.createElement('div'); wrap.className='die-wrap';
            const die=document.createElement('div');
            die.className='die'+(held[i]?' held':'');
            die.onclick=()=>toggleHold(i);
            for(let c=0;c<9;c++){const dot=document.createElement('div');dot.className='dot'+(DOT_MAP[val].includes(c)?'':' off');die.appendChild(dot);}
            const tag=document.createElement('div'); tag.className='die-held-tag'; tag.textContent=held[i]?'HELD':'';
            wrap.appendChild(die); wrap.appendChild(tag); row.appendChild(wrap);
        });
    }

    /* ── Render scorecard (event-delegated) ── */
    function renderScorecard() {
        const card=document.getElementById('scorecard');
        card.innerHTML='<h2>Scorecard</h2>';
        let lastSec=null;
        const uf=upperFilled(), us=upperSum();

        CATS.forEach(cat=>{
            if(cat.sec!==lastSec){
                if(lastSec==='upper'){
                    const d1=document.createElement('div');d1.className='divider';card.appendChild(d1);
                    const bt=document.createElement('div');bt.className='bonus-track';
                    bt.innerHTML=`<span>Bonus (upper ≥ 63)</span><span class="bonus-val">${uf===6?(us>=63?'+35':'0'):`${us}/63`}</span>`;
                    card.appendChild(bt);
                    const bw=document.createElement('div');bw.className='bonus-bar-wrap';
                    const bf=document.createElement('div');bf.className='bonus-bar-fill';bf.style.width=`${Math.min(1,us/63)*100}%`;
                    bw.appendChild(bf);card.appendChild(bw);
                    const d2=document.createElement('div');d2.className='divider';card.appendChild(d2);
                }
                const lbl=document.createElement('div');lbl.className='section-label';
                lbl.textContent=cat.sec==='upper'?'Upper Section':'Lower Section';
                card.appendChild(lbl); lastSec=cat.sec;
            }

            const isFilled=cat.id in scores;
            const isScratched=isFilled&&scores[cat.id]===0;
            const potential=(hasRolled&&!isFilled)?calcScore(cat.id,dice):null;

            const row=document.createElement('div');
            let cls='score-row';
            if(isFilled) cls+=isScratched?' filled scratched':' filled';
            if(!isFilled&&hasRolled){
                cls+=' clickable';
                if(potential!==null&&potential>0) cls+=' preview';
                else if(potential!==null&&potential===0) cls+=' scratch-option';
                row.dataset.catId=cat.id;
            }
            row.className=cls;

            let valHtml;
            if(isFilled){
                valHtml=`<span class="score-val ${isScratched?'scored-zero':'scored'}">${isScratched?'×':scores[cat.id]}</span>`;
            }else if(potential!==null&&potential>0){
                valHtml=`<span class="score-val preview-pos">${potential}</span>`;
            }else if(potential!==null&&potential===0){
                valHtml=`<span class="score-val scratch-zero">×</span>`;
            }else{
                valHtml=`<span class="score-val empty">—</span>`;
            }
            row.innerHTML=`<div><div class="score-name">${cat.name}</div><div class="score-desc">${cat.desc}</div></div>${valHtml}`;
            card.appendChild(row);
        });

        const totalRow=document.createElement('div');
        totalRow.className='total-row';
        totalRow.innerHTML=`<span>Total</span><span>${totalScore()}</span>`;
        card.appendChild(totalRow);

        card.onclick=(e)=>{
            const row=e.target.closest('[data-cat-id]');
            if(row) assignScore(row.dataset.catId, e.clientX, e.clientY);
        };
    }

    /* ── Controls ── */
    function updateControls(){
        const rollsDone=3-rollsLeft;
        document.getElementById('rollBtn').disabled=rollsLeft===0;
        document.getElementById('turnNum').textContent=turn;
        for(let i=0;i<3;i++){
            const dot=document.getElementById('rd'+i);
            if(i<rollsDone)                       dot.className='roll-dot done';
            else if(i===rollsDone&&rollsLeft>0)   dot.className='roll-dot next';
            else                                   dot.className='roll-dot';
        }
        const rt=document.getElementById('rollText');
        if(rollsDone===0)       rt.innerHTML='Roll <strong>1</strong> of 3';
        else if(rollsLeft===0)  rt.innerHTML='<strong>All 3</strong> rolls used';
        else                    rt.innerHTML=`Roll <strong>${rollsDone}</strong> of 3 done`;

        const hint=document.getElementById('hint');
        const card=document.getElementById('scorecard');
        if(!hasRolled){
            hint.textContent='Press Roll Dice to begin your turn';
            hint.style.color=''; card.classList.remove('must-choose');
        }else if(rollsLeft>0){
            hint.textContent='Click dice to hold · Roll again or pick a score';
            hint.style.color=''; card.classList.remove('must-choose');
        }else{
            hint.textContent='No rolls left — you MUST pick a category! (green = score, red × = scratch)';
            hint.style.color='rgba(210,140,80,0.85)';
            card.classList.add('must-choose');
        }
    }

    /* ── Game actions ── */
    function toggleHold(i){ if(!hasRolled)return; held[i]=!held[i]; renderDice(); }

    function roll(){
        if(rollsLeft===0)return;
        shakeArea();
        monkeyRollReact();
        hasRolled=true; rollsLeft--;
        dice.forEach((_,i)=>{ if(!held[i]) dice[i]=Math.floor(Math.random()*6)+1; });
        renderDice(); renderScorecard(); updateControls();
        document.querySelectorAll('.die').forEach((el,i)=>{
            if(!held[i]){el.classList.add('rolling');setTimeout(()=>el.classList.remove('rolling'),350);}
        });
    }

    function assignScore(id, cx, cy){
        if(!hasRolled||id in scores)return;
        const prevBonus=(upperFilled()===6&&upperSum()>=63);
        const pts=calcScore(id,dice);
        scores[id]=pts;

        // Floating score number
        floatPts(pts, cx||window.innerWidth/2, cy||window.innerHeight/2);

        // Bonus popup
        const nowBonus=(upperFilled()===6&&upperSum()>=63);
        if(!prevBonus&&nowBonus) setTimeout(showBonusPopup, 300);

        // Monkey reactions
        if(pts===0) monkeyReact('scratch');
        if(id==='yatzy'&&pts===50) celebrateYatzy();

        if(Object.keys(scores).length===15){
            setTimeout(endGame, id==='yatzy'&&pts===50?2900:0);
            return;
        }

        turn++; dice=[1,1,1,1,1]; held=[false,false,false,false,false];
        rollsLeft=3; hasRolled=false;
        document.getElementById('scorecard').classList.remove('must-choose');
        renderDice(); renderScorecard(); updateControls();

        // Flash total row
        setTimeout(()=>{ const t=document.querySelector('.total-row'); if(t){t.classList.add('pop');setTimeout(()=>t.classList.remove('pop'),500);} },80);
    }

    /* ── Animation helpers ── */
    function shakeArea(){
        const a=document.getElementById('diceArea');
        a.classList.remove('shaking'); void a.offsetWidth; a.classList.add('shaking');
        setTimeout(()=>a.classList.remove('shaking'),450);
    }

    function floatPts(pts, x, y){
        const el=document.createElement('div');
        el.className='float-pts '+(pts>0?'pts-good':'pts-zero');
        el.textContent=pts>0?`+${pts}`:'scratch';
        el.style.cssText=`left:${x}px;top:${y}px;transform:translateY(0) scale(1.2);opacity:1;`;
        document.body.appendChild(el);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
            el.style.transform='translateY(-80px) scale(1)';
            el.style.opacity='0';
        }));
        setTimeout(()=>el.remove(),1000);
    }

    function showBonusPopup(){
        const el=document.createElement('div'); el.className='bonus-popup';
        el.textContent='🎉 +35 Bonus!';
        document.body.appendChild(el);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
            el.style.transform='translate(-50%,-80px)'; el.style.opacity='0';
        }));
        setTimeout(()=>el.remove(),1400);
    }

    /* ── Yatzy celebration ── */
    function celebrateYatzy(){
        const canvas=document.getElementById('yatzy-canvas');
        const ctx=canvas.getContext('2d');
        canvas.width=window.innerWidth; canvas.height=window.innerHeight;
        const colors=['#f0c040','#e8395a','#40c8f0','#60f080','#e040f0','#ffffff','#ff8c00'];
        const particles=[];
        function mkP(x,y,vx,vy){return{x,y,vx,vy,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.25,color:colors[Math.floor(Math.random()*colors.length)],w:Math.random()*11+5,h:Math.random()*6+3,life:1};}
        const cx=canvas.width/2,cy=canvas.height*0.42;
        for(let i=0;i<120;i++){const a=Math.random()*Math.PI*2,s=Math.random()*14+4;particles.push(mkP(cx,cy,Math.cos(a)*s,Math.sin(a)*s-4));}
        for(let i=0;i<80;i++){particles.push(mkP(Math.random()*canvas.width,-20,(Math.random()-0.5)*5,Math.random()*5+2));}
        const dur=200; let frame=0;
        (function animate(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.vx*=0.99;p.rot+=p.rotV;p.life=Math.max(0,1-frame/dur);ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
            frame++;
            if(frame<dur)requestAnimationFrame(animate);else ctx.clearRect(0,0,canvas.width,canvas.height);
        })();
        [document.getElementById('yatzy-flash'),document.getElementById('yatzy-text'),document.getElementById('yatzy-sub')].forEach(el=>{el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');});
        document.querySelectorAll('.die').forEach(d=>{d.style.boxShadow='0 0 24px 6px rgba(240,192,64,0.9)';setTimeout(()=>d.style.boxShadow='',2000);});
        monkeyReact('yatzy');
    }

    /* ── Monkey system ── */
    let _jokePool=[...JOKES].sort(()=>Math.random()-0.5);
    let _jokeIdx=0;
    function nextJoke(){
        if(_jokeIdx>=_jokePool.length){_jokePool=[...JOKES].sort(()=>Math.random()-0.5);_jokeIdx=0;}
        return _jokePool[_jokeIdx++];
    }

    function scheduleJoke(el, minMs, maxMs){
        setTimeout(()=>{
            if(!el.classList.contains('show')){
                el.textContent=nextJoke();
                el.classList.add('show');
                setTimeout(()=>{
                    el.classList.remove('show');
                    scheduleJoke(el, 6000+Math.random()*8000, 0);
                }, 4500+Math.random()*3000);
            } else {
                scheduleJoke(el, 2000, 3000);
            }
        }, minMs+Math.random()*(maxMs||1));
    }

    function initMonkeys(){
        document.querySelectorAll('.mky-speech').forEach((el,i)=>{
            scheduleJoke(el, 1500+i*2200, 3000);
        });
    }

    function monkeyRollReact(){
        const phrases=['OOH OOH! 🐒','Roll it! 🎲','AAH AAH! 🙉','GO GO GO! 🎉','Come on! 🍀','YESSS! 🙌'];
        const speeches=Array.from(document.querySelectorAll('.mky-speech'));
        const free=speeches.filter(s=>!s.classList.contains('show'));
        if(!free.length)return;
        const el=free[Math.floor(Math.random()*free.length)];
        el.textContent=phrases[Math.floor(Math.random()*phrases.length)];
        el.classList.add('show');
        setTimeout(()=>el.classList.remove('show'),1600);
    }

    function monkeyReact(event){
        const monkeys=document.querySelectorAll('.type-jump');
        if(event==='yatzy'){
            monkeys.forEach(m=>{m.style.animationDuration='0.28s';setTimeout(()=>m.style.animationDuration='',3500);});
            document.querySelectorAll('.mky-speech').forEach((el,i)=>{
                setTimeout(()=>{el.classList.remove('show');el.textContent='🎉 YATZY!!!';void el.offsetWidth;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);},i*250);
            });
        }else if(event==='scratch'){
            const speeches=Array.from(document.querySelectorAll('.mky-speech'));
            const free=speeches.filter(s=>!s.classList.contains('show'));
            if(!free.length)return;
            const el=free[Math.floor(Math.random()*free.length)];
            const sad=['Ouch... 😬','Welp! 😅','Yikes! 🙈','Oh no! 😩'];
            el.textContent=sad[Math.floor(Math.random()*sad.length)];
            el.classList.add('show');
            setTimeout(()=>el.classList.remove('show'),2000);
        }
    }

    /* ── End / new game ── */
    function endGame(){
        renderDice(); renderScorecard();
        document.getElementById('finalScoreVal').textContent=totalScore();
        document.getElementById('scoreRating').textContent=rating(totalScore());
        document.getElementById('overlay').classList.add('show');
    }

    function rating(s){
        if(s>=300)return'Incredible — top 1%!';
        if(s>=250)return'Excellent game!';
        if(s>=200)return'Great score!';
        if(s>=150)return'Good effort!';
        if(s>=100)return'Not bad — keep practicing!';
        return'Better luck next time!';
    }

    function newGame(){
        dice=[1,1,1,1,1]; held=[false,false,false,false,false];
        rollsLeft=3; scores={}; hasRolled=false; turn=1;
        document.getElementById('overlay').classList.remove('show');
        document.getElementById('scorecard').classList.remove('must-choose');
        renderDice(); renderScorecard(); updateControls();
    }

    newGame();
    initMonkeys();
</script>
</body>
</html>
